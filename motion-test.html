<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Branch Studio — motion test</title>
<style>
  body{margin:0;font:13px ui-monospace,Menlo,Consolas,monospace;background:#0c0e10;color:#cacccc}
  #out{padding:14px;white-space:pre-wrap;line-height:1.55;font:inherit}
  #summary{padding:0 14px 16px;color:#949494;margin:0;white-space:pre-wrap}
  #frame{width:1440px;height:900px;border:0;position:absolute;left:-9999px;top:0}
  h1{font-size:13px;padding:10px 14px 0;color:#a3a6a7}
</style>
</head>
<body>
<h1>Branch Studio motion harness — <span id="verdict">running…</span></h1>
<div id="out"></div>
<pre id="summary"></pre>
<iframe id="frame" src="index.html?harness=1"></iframe>
<script>
const out=document.getElementById('out'),verdict=document.getElementById('verdict'),summary=document.getElementById('summary');
const results=[];
let n=0;
function log(cls,msg){
  if(cls!=='pass'&&cls!=='fail')cls='info';
  n++;results.push(cls);
  out.textContent+=(n>1?'\n':'')+String(n).padStart(2,'0')+' ['+cls.toUpperCase()+'] '+msg;
  summary.textContent='checks='+results.length+'  fails='+results.filter(c=>c==='fail').length;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// layout-shift only reports for the document that created the observer, so the
// collector has to live inside the app frame, not here.
async function arm(w){await w.eval(`
  window.__shifts=[];
  if(window.__po)window.__po.disconnect();
  window.__po=new PerformanceObserver(l=>{for(const e of l.getEntries()){if(e.hadRecentInput)continue;
    window.__shifts.push({v:+e.value.toFixed(6),src:(e.sources||[]).map(s=>((s.node&&(s.node.className||s.node.nodeName))||'?')+'@'+Math.round(s.previousRect.top)+'->'+Math.round(s.currentRect.top)).join(', ')})}});
  window.__po.observe({type:'layout-shift'});
  1`)}

async function run(){
  const f=document.getElementById('frame');
  await new Promise(r=>f.addEventListener('load',r));
  const w=f.contentWindow;
  await sleep(700);

  w.eval(`
    (function(){
      localStorage.clear();
      const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      const mk=(t,kids)=>({id:uid('n'),text:t,children:kids||[]});
      const S=eval('state');
      S.documents=[{id:uid('d'),title:'Harness',createdAt:Date.now(),updatedAt:Date.now(),mode:'branch',selectedId:null,
        tree:[
          mk('Alpha',[
             mk('Alpha maths',[mk('Square: $x^2 + y^2 = z^2$')]),
             mk('Alpha two',[mk('Deep A'),mk('Deep B')])
           ]),
          mk('Beta',[mk('Beta one'),mk('Beta two')]),
          mk('Gamma')
        ]}];
      S.activeDocumentId=S.documents[0].id;
      eval('adoptState')(S);
      eval('doc')().selectedId=eval('tree')()[0].children[0].id;
      eval('renderAll')();
      return 'ok';
    })();
  `);
  await sleep(800);

  const info=JSON.parse(await w.eval(`JSON.stringify({
    cards:document.querySelectorAll('#columns .note[data-id]').length,
    maths:document.querySelectorAll('#columns math-field').length,
    cols:document.querySelectorAll('#columns .column').length,
    treeLen:eval('tree')().length
  })`));
  log(info.cards>=6?'pass':'fail',`fixture: ${info.cards} cards across ${info.cols} columns (root -> Alpha maths -> its child)`);
  log(info.maths===1?'pass':'fail',`fixture: ${info.maths} math-field rendered`);
  await w.eval("document.querySelectorAll('#columns math-field').forEach(m=>m.dataset.probe='math')");

  // --- non-destructive first: prove MathLive is not re-initialised while the maths note stays on screen
  const mathsId=JSON.parse(await w.eval(`
    (function(){
      const f=eval('flatten')().find(x=>/\\$x\\^2/.test(x.node.text||''));
      if(!f)return JSON.stringify({err:'no maths note'});
      eval('selectNode')(f.node.id);
      return JSON.stringify({id:f.node.id});
    })()`)).id;
  await sleep(400);
  await w.eval("(function(){const m=document.querySelector('#columns math-field');if(m)m.dataset.probe='math'})()");
  for(const code of ["runCommand('addChild')","runCommand('moveDown')","runCommand('moveUp')"]){
    w.eval(code);
    await sleep(600);
    await w.eval(`eval('selectNode')(${JSON.stringify(mathsId)})`);
    await sleep(350);
    const alive=await w.eval("(function(){const m=document.querySelector('#columns math-field');return !!m&&m.dataset.probe==='math'})()");
    log(alive?'pass':'fail',`MathLive node survived: ${code}`);
  }

  const OPS=[
    ['addSibling',"runCommand('addSibling')"],
    ['addChild',  "runCommand('addChild')"],
    ['addTopic',  "runCommand('addTopic')"],
    ['indent',    "runCommand('indent')"],
    ['outdent',   "runCommand('outdent')"],
    ['moveUp',    "runCommand('moveUp')"],
    ['moveDown',  "runCommand('moveDown')"],
    ['deleteNode',"runCommand('deleteNode')"],
  ];

  for(const [name,code] of OPS){
    // pin a ROOT card: root cards are on every path, so they can never legitimately leave the DOM
    const pin=JSON.parse(await w.eval(`
      (function(){
        const keep=document.querySelector('#columns .column[data-depth="0"] .note[data-id]');
        if(!keep)return JSON.stringify({err:'no root card'});
        window.__pinned=keep;keep.dataset.pinned='1';
        return JSON.stringify({id:keep.dataset.id,text:(keep.textContent||'').slice(0,16)});
      })()`));
    await sleep(150);
    await arm(w);
    w.eval(code);
    await sleep(900);
    // re-select the pinned note so it is on the rendered path again, then check identity
    const state=JSON.parse(await w.eval(`
      (function(){
        const p=window.__pinned;
        if(p&&p.dataset.id)eval('selectNode')(p.dataset.id);
        return new Promise(r=>setTimeout(()=>{
          const fresh=document.querySelector('#columns .note[data-id="'+p.dataset.id+'"]');
          r(JSON.stringify({connected:!!(p&&p.isConnected),present:!!fresh,sameNode:fresh===p,pinAttr:fresh?(fresh.dataset.pinned==='1'):false}));
        },250));
      })()`));
    const shifts=JSON.parse(await w.eval("JSON.stringify(window.__shifts)"));
    const total=shifts.reduce((a,s)=>a+s.v,0);
    const survived=state.connected&&state.present&&state.sameNode&&state.pinAttr;
    log(survived?'pass':'fail',`${name}: root card ("${pin.text}") survived — connected=${state.connected} present=${state.present} sameNode=${state.sameNode} pin=${state.pinAttr}`);
    log(total<0.02?'pass':'fail',`${name}: layout shift ${total.toFixed(5)} over ${shifts.length} entr${shifts.length===1?'y':'ies'}`);
    if(shifts.length)log('info','        '+shifts.slice(0,3).map(s=>`${s.v} ${s.src}`).join(' ;; '));
    await sleep(150);
  }

  await sleep(700);
  const flying=await w.eval(`
    document.getAnimations().filter(a=>{
      try{
        const t=a.effect&&a.effect.target;
        if(!t||!t.classList||!t.classList.contains('note'))return false;
        return a.effect.getKeyframes().some(f=>{const m=/translate\\((-?[\\d.]+)px/.exec(f.transform||'');return m&&Math.abs(parseFloat(m[1]))>4});
      }catch(e){return false}
    }).length
  `);
  log(flying===0?'pass':'fail',`cards left mid-translate after settle: ${flying}`);

  await w.eval("(function(){const e=document.querySelector('#columns .note.active .note-editor')||document.querySelector('#columns .note-editor');window.__ed=e;e&&e.focus()})()");
  await sleep(120);
  await w.eval("(function(){const e=window.__ed;if(!e)return;e.textContent='typed here';e.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText'}))})()");
  await sleep(350);
  const stillThere=await w.eval("!!(window.__ed && window.__ed.isConnected && document.activeElement===window.__ed)");
  log(stillThere?'pass':'fail','typing keeps the same editor node focused (no rebuild under the caret)');

  // ---------- trajectory: does a neighbour card glide or lurch? ----------
  // Jumpy motion shows up as a direction reversal or a single huge frame delta in the samples.
  async function trajectory(w,label,selectIdx,victimIdx,code){
    const res=JSON.parse(await w.eval(`
      (function(){
        const roots=[...document.querySelectorAll('#columns .column[data-depth="0"] .note[data-id]')];
        if(roots.length<${victimIdx}+1)return JSON.stringify({err:'need ${victimIdx+1} root cards, have '+roots.length});
        eval('selectNode')(roots[${selectIdx}].dataset.id);
        const id=roots[${victimIdx}].dataset.id;
        window.__traj=[];
        const t0=performance.now();
        (function tick(){
          const el=document.querySelector('#columns .note[data-id="'+id+'"]');
          if(el)window.__traj.push([+(performance.now()-t0).toFixed(1),+el.getBoundingClientRect().top.toFixed(2)]);
          if(performance.now()-t0<600)requestAnimationFrame(tick);
        })();
        eval(${JSON.stringify(code)});
        return JSON.stringify({ok:true,id});
      })();`));
    if(res.err){log('fail',label+': '+res.err);return}
    await sleep(900);
    const traj=JSON.parse(await w.eval('JSON.stringify(window.__traj)'));
    if(traj.length<8){log('fail',`${label}: too few samples (${traj.length})`);return}
    const travel=Math.abs(traj[traj.length-1][1]-traj[0][1]);
    log(travel>15?'pass':'fail',`${label}: victim card actually travelled ${travel.toFixed(1)}px (test is live)`);
    let maxStep=0,reversals=0,dir=0,moving=0;
    for(let i=1;i<traj.length;i++){
      const d=traj[i][1]-traj[i-1][1];
      maxStep=Math.max(maxStep,Math.abs(d));
      if(Math.abs(d)>0.4){moving++;const nd=Math.sign(d);if(dir&&nd!==dir)reversals++;dir=nd}
    }
    // a jump teleports: one frame covers most of the distance and the card is instantly at rest.
    // a glide spreads it out. judge the shape, not an absolute pixel count (easing sets the peak).
    const peakShare=travel>0?maxStep/travel:0;
    log(peakShare<0.55?'pass':'fail',`${label}: largest single frame = ${maxStep.toFixed(1)}px (${(peakShare*100).toFixed(0)}% of travel — a teleport would be ~100%)`);
    log(moving>=4?'pass':'fail',`${label}: motion spread over ${moving} frames`);
    log(reversals<=1?'pass':'fail',`${label}: direction reversals ${reversals} (${traj.length} samples over 600ms)`);
    const settled=Math.abs(traj[traj.length-1][1]-traj[traj.length-3][1])<0.5;
    log(settled?'pass':'fail',`${label}: came to rest`);
  }
  // select the first root, add a sibling after it -> the card below must glide down
  await trajectory(w,'addSibling (card pushes its neighbour down)',0,1,"runCommand('addSibling')");
  await sleep(500);
  // select the second root and indent it into the first -> the third root glides up
  await trajectory(w,'indent (card leaves the root column)',1,2,"runCommand('indent')");

  // ---------- overlay teardown ----------
  // Every surface below survives its close: it stays in the DOM and gets shown
  // again. An exit that keeps its forwards fill, or its inline pointer-events,
  // bricks that surface for the rest of the session. Re-enter it, then check it.
  const CYCLES=5;
  async function probe(w,sel){
    return JSON.parse(await w.eval(`
      (function(){
        const el=document.querySelector(${JSON.stringify(sel)});
        if(!el)return JSON.stringify({missing:true});
        const cs=getComputedStyle(el);
        let fills=0;
        try{for(const a of el.getAnimations())if(a.effect&&a.effect.getComputedTiming().fill!=='none')fills++}catch(e){}
        const r=el.getBoundingClientRect();
        let hit='no-box';
        if(r.width>=1&&r.height>=1){
          const t=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
          hit=t?(t===el||el.contains(t))?'hit':'blocked-by:'+((t.className||'')+''||t.tagName):'null';
        }
        return JSON.stringify({connected:el.isConnected,opacity:+(+cs.opacity).toFixed(3),pe:cs.pointerEvents,
          inlinePE:el.style.pointerEvents||'',inlineOpacity:el.style.opacity||'',fills,hit,w:Math.round(r.width)});
      })()`));
  }
  const filled=p=>p.fills>0||p.inlinePE!==''||p.inlineOpacity!=='';
  const alive=p=>p.connected&&!filled(p);

  // --- toast: closed 5x in a row, and the Undo button must stay clickable every time
  for(let i=0;i<CYCLES;i++){
    await w.eval(`eval('toastAction')('Cycle ${i+1}','Undo',()=>{},700)`);
    await sleep(1200);   // 700ms of toast + 150ms exit + settle
    const p=await probe(w,'#toast');
    log(alive(p)?'pass':'fail',`toast ${i+1}/${CYCLES}: closed cleanly — connected=${p.connected} fills=${p.fills} inlinePE="${p.inlinePE}"`);
  }
  for(let i=0;i<CYCLES;i++){
    const r=JSON.parse(await w.eval(`
      (function(){
        window.__undone=0;
        eval('toastAction')('Undo me','Undo',()=>{window.__undone++},5000);
        const b=document.querySelector('#toast .toast-action');
        if(!b)return JSON.stringify({err:'no Undo button'});
        const r0=b.getBoundingClientRect();
        const t=document.elementFromPoint(r0.left+r0.width/2,r0.top+r0.height/2);
        const hittable=!!t&&(t===b||b.contains(t));
        if(hittable)b.click();
        return JSON.stringify({hittable,hitEl:t?((t.className||'')+''||t.tagName):'null',
          fired:window.__undone,pe:getComputedStyle(document.querySelector('#toast')).pointerEvents});
      })()`));
    if(r.err){log('fail',`toast Undo ${i+1}/${CYCLES}: ${r.err}`);continue}
    log(r.hittable&&r.fired===1?'pass':'fail',`toast Undo ${i+1}/${CYCLES}: clickable and clicked — hittable=${r.hittable} hitEl=${r.hitEl} handler=${r.fired} pointer-events=${r.pe}`);
    await sleep(150);
  }
  // stale exit: a toast raised while a previous toast's exit is still running.
  // forceToast animates out with exitEl; its deferred class removal must not land
  // on the toast that replaced it.
  await w.eval(`(function(){eval('forceToast')('Old',100);setTimeout(()=>eval('toastAction')('New','Undo',()=>{},60000),150);1})()`);
  await sleep(1200);
  const stale=JSON.parse(await w.eval(`JSON.stringify({text:(document.querySelector('#toast span')||{}).textContent,show:document.querySelector('#toast').classList.contains('show')})`));
  log((stale.text==='New'&&stale.show)?'pass':'fail',`toast: a toast raised mid-exit is not undone by the stale exit (text="${stale.text}" show=${stale.show})`);
  await w.eval(`(function(){const t=document.querySelector('#toast');t.classList.remove('show','has-action');t.textContent=''})()`);
  await sleep(400);

  // --- context menu: opens and closes 5x; nothing is orphaned, and a reopened
  //     menu must not be removed by the previous menu's exit
  for(let i=0;i<CYCLES;i++){
    await w.eval(`(function(){const a=document.querySelector('#undoBtn');eval('openMenu')(a,[{icon:'edit',label:'Item',run:()=>{}}],{title:'Harness'});eval('closeMenu')()})()`);
    await sleep(400);
    const p=JSON.parse(await w.eval(`JSON.stringify({pops:document.querySelectorAll('.menu-pop').length,backs:document.querySelectorAll('.menu-backdrop').length})`));
    log(p.pops===0&&p.backs===0?'pass':'fail',`menu ${i+1}/${CYCLES}: fully removed after close (pops=${p.pops} backdrops=${p.backs})`);
  }
  await w.eval(`(function(){const a=document.querySelector('#undoBtn');eval('openMenu')(a,[{icon:'edit',label:'A',run:()=>{}}]);eval('closeMenu')();window.__keep=eval('openMenu')(a,[{icon:'edit',label:'C',run:()=>{}}])})()`);
  await sleep(700);
  const gen=JSON.parse(await w.eval(`JSON.stringify({alive:!!window.__keep&&window.__keep.isConnected,live:document.body.contains(window.__keep),items:window.__keep?window.__keep.querySelectorAll('.menu-item').length:0})`));
  log(gen.alive&&gen.live&&gen.items===1?'pass':'fail',`generation guard: a menu reopened mid-exit survives it (connected=${gen.alive} inBody=${gen.live} items=${gen.items})`);
  await w.eval(`eval('closeMenu')()`); await sleep(400);

  // --- settings dialog closed with its ✕, 5x: reopen, prove it is visible and live, close again
  for(let i=0;i<CYCLES;i++){
    await w.eval(`eval('openSettings')('appearance')`);
    await sleep(360);
    const open=await probe(w,'#settingsDialog');
    const isOpen=await w.eval(`document.querySelector('#settingsDialog').open===true`);
    log(isOpen&&open.opacity>0.9&&!filled(open)&&open.hit==='hit'?'pass':'fail',`settings ✕ ${i+1}/${CYCLES}: reopen is visible and interactive — open=${isOpen} opacity=${open.opacity} fills=${open.fills} hit=${open.hit}`);
    await w.eval(`document.querySelector('#settingsDialog [data-close]').click()`);
    await sleep(420);
    const shut=await probe(w,'#settingsDialog');
    const closed=await w.eval(`document.querySelector('#settingsDialog').open===false`);
    log(closed&&alive(shut)?'pass':'fail',`settings ✕ ${i+1}/${CYCLES}: closed cleanly — open=${closed} connected=${shut.connected} fills=${shut.fills} inlinePE="${shut.inlinePE}"`);
  }

  // --- Escape takes the same animated path as ✕
  await w.eval(`eval('openSettings')('appearance')`);
  await sleep(360);
  await w.eval(`eval('closeTopLayer')()`);
  await sleep(420);
  const esc=await probe(w,'#settingsDialog');
  const escClosed=await w.eval(`document.querySelector('#settingsDialog').open===false`);
  log(escClosed&&alive(esc)?'pass':'fail',`Escape closes Settings through the animated path — open=${escClosed} fills=${esc.fills} inlinePE="${esc.inlinePE}"`);

  // --- documents drawer, 5x
  for(let i=0;i<CYCLES;i++){
    await w.eval(`eval('openDocuments')()`);
    await sleep(360);
    const open=await probe(w,'#documentOverlay .drawer');
    log(open.opacity>0.9&&open.hit==='hit'&&!filled(open)?'pass':'fail',`drawer ${i+1}/${CYCLES}: reopen is visible and interactive — opacity=${open.opacity} hit=${open.hit} fills=${open.fills}`);
    await w.eval(`eval('closeDocuments')()`);
    await sleep(420);
    const shut=await probe(w,'#documentOverlay .drawer');
    log(alive(shut)?'pass':'fail',`drawer ${i+1}/${CYCLES}: closed cleanly — connected=${shut.connected} fills=${shut.fills} inlinePE="${shut.inlinePE}"`);
  }
  // Escape on the drawer as well
  await w.eval(`eval('openDocuments')()`); await sleep(320);
  await w.eval(`eval('closeTopLayer')()`); await sleep(420);
  const dEsc=await probe(w,'#documentOverlay .drawer');
  log(alive(dEsc)?'pass':'fail',`drawer closed with Escape is clean too — fills=${dEsc.fills} inlinePE="${dEsc.inlinePE}"`);

  // --- zen in and out, 5x: the workspace must come back every time
  for(let i=0;i<CYCLES;i++){
    await w.eval(`eval('zenSet')(true)`);
    await sleep(650);
    await w.eval(`eval('zenSet')(false)`);
    await sleep(750);
    const p=await probe(w,'#workspace');
    log(p.connected&&p.opacity>0.9&&p.pe!=='none'&&p.hit==='hit'&&!filled(p)?'pass':'fail',
      `zen ${i+1}/${CYCLES}: workspace interactive again — connected=${p.connected} opacity=${p.opacity} pointer-events=${p.pe} hit=${p.hit} fills=${p.fills} inlinePE="${p.inlinePE}"`);
    const typing=JSON.parse(await w.eval(`(function(){
        const e=document.querySelector('#columns .note-editor');
        if(!e)return JSON.stringify({err:'no editor'});
        const r=e.getBoundingClientRect();
        const t=r.width>=1?document.elementFromPoint(r.left+r.width/2,r.top+Math.min(12,r.height/2)):null;
        const hittable=!!t&&(t===e||e.contains(t)||t.closest?.('.note')===e.closest('.note'));
        if(hittable)e.focus();
        return JSON.stringify({hittable,hitEl:t?((t.className||'')+''||t.tagName):'null',focused:document.activeElement===e});
      })()`));
    log(typing.hittable&&typing.focused?'pass':'fail',`zen ${i+1}/${CYCLES}: the editing surface is hittable and takes focus — hittable=${typing.hittable} hitEl=${typing.hitEl} focused=${typing.focused}`);
  }

  // ---------- zen: flat stream, one scroller, typewriter, entry latch ----------
  // A document long enough that the zen stream cannot fit the viewport, with notes
  // deliberately OFF the selected path — the path-only renderer dropped every one.
  const zf=JSON.parse(await w.eval(`
    (function(){
      const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      const mk=(t,kids)=>({id:uid('n'),text:t,children:kids||[]});
      const S=eval('state');
      const long=[];for(let i=1;i<=14;i++)long.push(mk('Long note '+i));
      const deep3=mk('Deep three');
      const deep2=mk('Deep two',[deep3]);
      const chain=mk('Deep root',[mk('Deep one',[deep2])]);
      S.documents=[{id:uid('d'),title:'Zen harness',createdAt:Date.now(),updatedAt:Date.now(),mode:'branch',selectedId:null,
        tree:[mk('Top A',[mk('Top A child')]),mk('Top B',long),chain]}];
      S.activeDocumentId=S.documents[0].id;
      eval('doc')().selectedId=deep3.id;
      eval('renderAll')();
      return JSON.stringify({total:eval('flatten')().length,deep3:deep3.id,offPath:long[6].id,onPath:deep2.id,tail:long[long.length-1].id});
    })()`));
  await sleep(900);
  log(zf.total>=18?'pass':'fail',`zen fixture: ${zf.total} notes, caret on a depth-3 note so the path is 4 columns long`);

  await w.eval(`eval('zenSet')(true)`);
  await sleep(800);
  const zen=JSON.parse(await w.eval(`
    (function(){
      const ws=document.querySelector('#workspace');
      const cols=[...document.querySelectorAll('#columns .column')];
      const notes=[...document.querySelectorAll('#columns .note[data-id]')];
      const domIds=notes.map(n=>n.dataset.id);
      const flatIds=eval('flatten')().map(f=>f.node.id);
      const cs=getComputedStyle(ws);
      const off=notes.find(n=>n.dataset.id===${JSON.stringify(zf.offPath)})||null;
      // a real parent/child pair: the first child column, and the note its column names as parent
      const childCol=cols.find(c=>c.classList.contains('child-column'))||null;
      const pr=(childCol?notes.find(n=>n.dataset.id===childCol.dataset.parent):null)||notes[0]||null;
      const cr=childCol?childCol.querySelector('.note[data-id]'):null;
      const r=off?off.getBoundingClientRect():null;
      return JSON.stringify({
        zen:document.documentElement.classList.contains('zen'),
        columns:cols.length,
        childColumns:cols.filter(c=>c.classList.contains('child-column')).length,
        domCards:notes.length,
        docNotes:flatIds.length,
        orderMatch:domIds.length>0&&domIds.length===flatIds.length&&domIds.every((id,i)=>id===flatIds[i]),
        offPathInDom:!!off,
        offPathH:r?Math.round(r.height):0,
        overflowY:cs.overflowY,
        scrollable:(ws.scrollWidth>ws.clientWidth+4?'both axes':(ws.scrollHeight>ws.clientHeight+4?'vertical only':'no range')),
        parentX:pr?Math.round(pr.getBoundingClientRect().x):null,
        childX:cr?Math.round(cr.getBoundingClientRect().x):null,
        sameRow:!!(pr&&cr&&Math.abs(pr.getBoundingClientRect().y-cr.getBoundingClientRect().y)<40),
        childRightOfParent:!!(pr&&cr&&cr.getBoundingClientRect().x>pr.getBoundingClientRect().x)
      });
    })()`));
  log(zen.zen?'pass':'fail','zen: html.zen is set on entry');
  // Zen used to flatten the whole document into a single column, which made it impossible to
  // put a child to the right of its parent - the exact complaint it was meant to avoid. It is a

  log(zen.columns>=2&&zen.childColumns>=1?'pass':'fail',`zen: the outliner keeps its columns, so a child can sit beside its parent (columns=${zen.columns}, child-columns=${zen.childColumns})`);

    (function(){

    (function(){

  await sleep(750);
  await w.eval(`(function(){eval('state').behavior.showAddButtons=true;eval('renderAll')()})()`);

  await w.eval(`(function(){eval('zenSet')(false);return 1})()`);

  await w.eval(`(function(){eval('zenSet')(true);return 1})()`);

  const wrap=JSON.parse(await w.eval(`
    (function(){

  await w.eval(`(function(){const S=eval('state');S.documents.find(d=>d.id===S.activeDocumentId).mode='branch';eval('renderAll')()})()`);

  // built a context. Reset the engine first so these checks test the guarantees from a known

  await w.eval(`(function(){const S=eval('SOUND');S.ctx=null;S.master=null;S.delay=null;S.fb=null;

  log((sec.voices||[]).join(',')==='typing,scifi,soft,crisp,deep,glass,mechanical,typewriter'?'pass':'fail',`sound settings: Typing and Sci-fi lead the list, eight voices (${(sec.voices||[]).join(', ')})`);

  const sOffVoice=await je(`
    (function(){const sel=document.querySelector('[data-section="sound"] [data-sound="theme"]');

    (function(){const b=[...document.querySelectorAll('[data-sound-preview]')];const all=document.querySelector('#soundPreviewAll');

  const sAudition=await je(`
    (function(){const b=[...document.querySelectorAll('[data-sound-preview]')];const all=document.querySelector('#soundPreviewAll');

  const sPrevBefore=await sProbe();

  log(zenFs.asked===1&&zenFs.zen===true?'pass':'fail',
    `zen: entering asks the browser for real fullscreen, so its own bars go away (requestFullscreen calls=${zenFs.asked})`);

  // ---- appearance engine ---------------------------------------------------------------
  await soft(`(function(){eval('openSettings')('appearance');return 1})()`);
  await sleep(500);
  const ap=await je(`(function(){
    const sec=document.querySelector('[data-section="appearance"]');
    return JSON.stringify({
      presets:[...sec.querySelectorAll('[data-preset]')].map(b=>b.dataset.preset),
      colours:sec.querySelectorAll('input[type="color"]').length,
      fonts:sec.querySelectorAll('select[data-appearance^="font"]').length,
      sliders:sec.querySelectorAll('input[type="range"]').length,
      fx:[...sec.querySelectorAll('[data-fx]')].filter(b=>b.tagName==='BUTTON').map(b=>b.dataset.fx)
    })})()`,{});
  log((ap.presets||[]).length>=6&&ap.colours>=8&&ap.fonts===2&&ap.sliders>=18&&(ap.fx||[]).length>=5?'pass':'fail',
    `themes: the panel exposes presets, eight colour tokens, type, shape and atmosphere (presets=${(ap.presets||[]).length}, colours=${ap.colours}, fonts=${ap.fonts}, sliders=${ap.sliders}, atmosphere=${(ap.fx||[]).length})`);

  const apply=await je(`(function(){
    const before={bg:getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
                  accent:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()};
    document.querySelector('[data-preset="nebula"]').click();
    const cs=getComputedStyle(document.documentElement);
    const card=document.querySelector('.note-body');
    return JSON.stringify({before,bg:cs.getPropertyValue('--bg').trim(),accent:cs.getPropertyValue('--accent').trim(),
      text:cs.getPropertyValue('--text').trim(),theme:eval('state').appearance.theme,
      active:document.querySelectorAll('[data-preset].active').length,
      radius:card?getComputedStyle(card).borderTopLeftRadius:null,
      fx:document.documentElement.dataset.fx,
      canvas:getComputedStyle(document.getElementById('fxLayer')).display})})()`,{});
  log(apply.bg!==apply.before.bg&&apply.accent!==apply.before.accent&&apply.theme==='nebula'&&apply.active===1&&apply.radius==='12px'&&apply.fx==='stars'&&apply.canvas!=='none'?'pass':'fail',
    `themes: applying Nebula rewrites the whole token set at once (bg ${apply.before.bg}→${apply.bg}, accent ${apply.before.accent}→${apply.accent}, text=${apply.text}, radius=${apply.radius}, atmosphere=${apply.fx})`);

  const brush=await je(`(function(){
    const i=document.querySelector('[data-appearance="text"]');i.value='#ff2d55';i.dispatchEvent(new Event('input',{bubbles:true}));
    const cs=getComputedStyle(document.documentElement);
    const ed=document.querySelector('.note-editor');
    return JSON.stringify({token:cs.getPropertyValue('--text').trim(),
      note:ed?getComputedStyle(ed).color:null,
      theme:eval('state').appearance.theme,
      active:document.querySelectorAll('[data-preset].active').length})})()`,{});
  log(brush.token==='#ff2d55'&&brush.note==='rgb(255, 45, 85)'&&brush.theme==='custom'&&brush.active===0?'pass':'fail',
    `themes: a colour edit reaches the text that uses it and flips the theme to custom (token=${brush.token}, note=${brush.note})`);

  const typeface=await je(`(function(){
    const s=document.querySelector('[data-appearance="fontNote"]');s.value='serif';s.dispatchEvent(new Event('change',{bubbles:true}));
    const ed=document.querySelector('.note-editor');
    return JSON.stringify({font:ed?getComputedStyle(ed).fontFamily:null})})()`,{});
  log(/serif|Georgia|Iowan|Palatino|Times/i.test(typeface.font||'')?'pass':'fail',
    `themes: the note face follows the type choice (${String(typeface.font).slice(0,44)})`);

  const atmos=await je(`(async function(){
    document.querySelector('[data-fx="stars"]').click();
    await new Promise(r=>setTimeout(r,420));
    const F=eval('FX');
    const cv=document.getElementById('fxLayer');
    const d=cv.getContext('2d').getImageData(0,0,Math.min(cv.width,900),Math.min(cv.height,500)).data;
    let lit=0;for(let i=3;i<d.length;i+=4)if(d[i]>8)lit++;
    return JSON.stringify({parts:F.parts.length,on:F.on,opacity:cv.style.opacity,lit})})()`,{});
  log(atmos.parts>20&&atmos.on===true&&atmos.lit>40?'pass':'fail',
    `atmosphere: the star field is drawn behind the cards (${atmos.parts} particles, ${atmos.lit} lit pixels, opacity ${atmos.opacity})`);

  const grid=await je(`(async function(){
    document.querySelector('[data-fx="grid"]').click();
    await new Promise(r=>setTimeout(r,520));
    const F=eval('FX'),cv=document.getElementById('fxLayer');
    const d=cv.getContext('2d').getImageData(0,0,Math.min(cv.width,900),Math.min(cv.height,500)).data;
    let lit=0;for(let i=3;i<d.length;i+=4)if(d[i]>6)lit++;
    return JSON.stringify({mode:eval('state').appearance.fx,parts:F.parts.length,lit})})()`,{});
  log(grid.mode==='grid'&&grid.parts>50&&grid.lit>200?'pass':'fail',
    `atmosphere: the grid preset paints its lattice (${grid.parts} points, ${grid.lit} lit pixels)`);

  const drift=await je(`(async function(){
    const d=eval('doc')();
    d.tree=Array.from({length:26},(_,i)=>({id:'fx'+i,text:'Paragraph '+i+' — the field should drift behind every card in both views.',children:[]}));
    d.selectedId='fx0';eval('saveState')();eval('renderAll')();eval('setMode')('read');
    await new Promise(r=>setTimeout(r,500));
    const F=eval('FX');
    const before={scroll:F.scroll,px:F.px};
    const el=document.querySelector('.read-pane')||document.querySelector('.workspace');
    if(el)el.scrollTop=420;
    window.dispatchEvent(new PointerEvent('pointermove',{clientX:innerWidth-40,clientY:innerHeight-40}));
    await new Promise(r=>setTimeout(r,900));
    const out={before,scroll:F.scroll,px:F.px,py:F.py};
    eval('setMode')('branch');
    return JSON.stringify(out)})()`,{});
  log(drift.scroll>80&&drift.px>0.2?'pass':'fail',
    `atmosphere: the field tracks scroll and pointer, so it parallaxes past the cards (scroll ${Math.round(drift.before.scroll)}→${Math.round(drift.scroll)}, pointer=${drift.px.toFixed(2)})`);

  const off=await je(`(function(){
    document.querySelector('[data-fx="off"]').click();
    const cv=document.getElementById('fxLayer');
    return JSON.stringify({fx:eval('state').appearance.fx,display:getComputedStyle(cv).display,on:eval('FX').on})})()`,{});
  log(off.fx==='off'&&off.display==='none'&&off.on===false?'pass':'fail',
    `atmosphere: switching it off removes the canvas and stops the loop (display=${off.display}, running=${off.on})`);

  await soft(`(function(){eval('applyThemePreset')('solitude');const d=document.querySelector('#settingsDialog');if(d&&d.open)d.close();eval('renderAll')();return 1})()`);
  await sleep(300);

  const fails=results.filter(c=>c==='fail').length;
  verdict.textContent=fails?`${fails} FAILED`:'all passed';
  verdict.className=fails?'fail':'pass';
  document.title=fails?`MOTION ${fails} FAILED`:'MOTION OK';
}
run().catch(e=>{log('fail','harness threw: '+e.message+' @ '+(e.stack||'').split('\n')[1]);verdict.textContent='ERROR';verdict.className='fail';document.title='MOTION ERROR'});
</script>
</body>
</html>
